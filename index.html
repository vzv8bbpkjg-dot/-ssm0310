utton><button onclick="openMonthIndex()">月間INDEX</button></div><input type="file" id="monthCoverFile" accept="image/*" style="display:none" onchange="uploadMonthCover(this)"><div class="calendar" id="homeCalendar"></div></div><div class="panel"><div class="panel-head"><h2 id="homeSelectedTitle">通知一覧</h2><div style="display:flex;align-items:center;gap:8px"><span class="muted" id="noticeCount"></span><button onclick="selectTodayHome()" style="padding:6px 9px;font-size:12px">今日</button></div></div><div id="notifications"></div></div></section><section id="category" class="hide"><div class="screen-title" id="categoryTitle"></div><div class="screen-tools"><button onclick="openForm()" id="addButton">＋ 登録する</button><button class="secondary" onclick="goHome()">ホーム</button></div><div class="panel"><div class="cal-head"><button onclick="shiftMonth('category',-1)">‹</button><strong id="categoryMonth"></strong><button onclick="shiftMonth('category',1)">›</button></div><div class="calendar" id="categoryCalendar"></div></div><div class="panel"><div class="panel-head"><h2 id="dayListTitle">登録一覧</h2></div><div id="dayEntries"></div></div><div id="moneyPanel" class="panel hide"><div class="panel-head"><h2>今月の予算</h2></div><div class="budget"><div class="budgetbox"><small>月予算</small><strong id="budgetDisplay">¥0</strong></div><div class="budgetbox"><small>今月の残高</small><strong id="remainingDisplay">¥0</strong></div></div><div class="budget-input"><input type="number" id="budgetInput" placeholder="月予算を入力"><button onclick="saveBudget()">保存</button></div></div></section><section id="monthIndexScreen" class="hide"><div class="screen-title">月間INDEX</div><div class="screen-tools"><button onclick="backFromIndex()">ホームへ戻る</button><button onclick="shiftIndexYear(-1)">前年</button><button onclick="shiftIndexYear(1)">翌年</button></div><div class="panel"><div class="panel-head"><h2 id="monthIndexYear"></h2></div><div class="index-grid" id="monthIndexGrid"></div></div></section><section id="yearIndexS <script>
const TYPES=['予定','メモ','Todo','お金'];const KEY='pocketPlannerEntries_v1',BKEY='pocketPlannerBudgets_v1',DB_NAME='PocketPlannerDB',DB_STORE='plannerState';let entries=[],budgets={},categories={'予定':[],'メモ':[],'Todo':[],'お金':[]},monthCovers={},yearCovers={};let indexYear=new Date().getFullYear(),coverYear=new Date().getFullYear();let active='予定',homeMonth=new Date(),catMonth=new Date(),selectedDate=dateKey(new Date()),editingId=null;
let dbPromise=new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB非対応'));return}let req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{let db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function readPersisted(){let idbLoaded=false;try{let db=await dbPromise;let tx=db.transaction(DB_STORE,'readonly'),req=tx.objectStore(DB_STORE).get('state');let state=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});if(state&&Array.isArray(state.entries)){entries=state.entries;budgets=state.budgets||{};categories=state.categories||categories;monthCovers=state.monthCovers||{};yearCovers=state.yearCovers||{};idbLoaded=true}}catch(e){console.warn('IndexedDB read:',e)}if(!idbLoaded){try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');budgets=JSON.parse(localStorage.getItem(BKEY)||'{}');categories=JSON.parse(localStorage.getItem('pocketPlannerCategories_v1')||JSON.stringify(categories));monthCovers=JSON.parse(localStorage.getItem('pocketPlannerMonthCovers_v1')||'{}');yearCovers=JSON.parse(localStorage.getItem('pocketPlannerYearCovers_v1')||'{}')}catch(e){entries=[];budgets={}}try{await persistState()}catch(migrateErr){console.warn('IndexedDB移行保存に失敗:',migrateErr)}}try{localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(BKEY,JSON.stringify(budgets))}catch(e){console.warn('バックアップ保存容量不足:',e)}}
async function persistState(){let db=await dbPromise;return new Promise((resolve,reject)=>{let tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put({entries,budgets,categories,monthCovers:monthCovers,yearCovers},'state');tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('保存に失敗'));tx.onabort=()=>reject(tx.error||new Error('保存が中断'))})}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function save(){let idbOk=false,backupOk=false;try{await persistState();idbOk=true}catch(err){console.error('IndexedDB保存:',err)}try{localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(BKEY,JSON.stringify(budgets));localStorage.setItem('pocketPlannerCategories_v1',JSON.stringify(categories));localStorage.setItem('pocketPlannerMonthCovers_v1',JSON.stringify(monthCovers));localStorage.setItem('pocketPlannerYearCovers_v1',JSON.stringify(yearCovers));backupOk=true}catch(err){console.warn('localStorage backup:',err)}if(!idbOk&&!backupOk){alert('保存できませんでした。Safariのサイトデータ容量や設定を確認してください。');return false}try{renderAll()}catch(err){console.error('保存後の画面更新エラー:',err)}return true}
function money(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function setClock(){let n=new Date();document.getElementById('todayDate').textContent=`${n.getMonth()+1}月${n.getDate()}日`;document.getElementById('todayWeek').textContent=n.toLocaleDateString('ja-JP',{weekday:'long',year:'numeric',month:'long'});document.getElementById('clock').textContent=n.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}
function shiftMonth(which,delta){let m=which==='home'?homeMonth:catMonth;m.setMonth(m.getMonth()+delta);renderCalendars()}
function calendarHTML(month,container,kind){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),html='';['日','月','火','水','木','金','土'].forEach(x=>html+=`<div class="weekday">${x}</div>`);for(let i=0;i<42;i++){let d=i-start+1,actual=d<1?new Date(y,m-1,prev+d):d>days?new Date(y,m+1,d-days):new Date(y,m,d);let key=dateKey(actual),isOther=d<1||d>days,has=kind==='home'?entries.some(e=>occursOn(e,key)):entries.some(e=>e.type===active&&occursOn(e,key)),sel=(kind==='category'||kind==='home')&&key===selectedDate,today=key===dateKey(new Date());html+=`<div class="day ${isOther?'other':''} ${sel?'selected':''} ${today?'today':''}" onclick="selectDate('${key}','${kind}')"><span class="num">${actual.getDate()}</span>${has?'<span class="star">★</span>':''}</div>`;}container.innerHTML=html;}
function repeatLabel(r){return ({daily:'毎日',weekly:'毎週',monthly:'毎月',yearly:'毎年',none:'なし'})[r]||'なし'}
function occursOn(e,key){if(!e.date)return false;let base=new Date(e.date+'T00:00:00'),target=new Date(key+'T00:00:00');if(target<base)return false;if(e.repeatEnd&&key>e.repeatEnd)return false;switch(e.repeat||'none'){case'daily':return true;case'weekly':return target.getDay()===base.getDay();case'monthly':return target.getDate()===base.getDate();case'yearly':return target.getMonth()===base.getMonth()&&target.getDate()===base.getDate();default:return key===e.date}}
function anniversaryStats(dateStr){let base=new Date(dateStr+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);let days=Math.max(0,Math.floor((today-base)/86400000));let years=today.getFullYear()-base.getFullYear();let ann=new Date(base.getFullYear()+years,base.getMonth(),base.getDate());if(ann>today)years--;let next=years+1,nd=new Date(base.getFullYear()+next,base.getMonth(),base.getDate());let rem=Math.ceil((nd-today)/86400000);return {days,current:Math.max(0,years),next,nextDate:dateKey(nd),remaining:Math.max(0,rem)}}
function renderCalendars(){document.getElementById('homeMonth').textContent=homeMonth.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});document.getElementById('categoryMonth').textContent=catMonth.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});calendarHTML(homeMonth,document.getElementById('homeCalendar'),'home');calendarHTML(catMonth,document.getElementById('categoryCalendar'),'category');renderCovers()}

function openCategory(type){active=type;catMonth=new Date(homeMonth);selectedDate=dateKey(new Date());document.getElementById('home').classList.add('hide');document.getElementById('category').classList.remove('hide');document.getElementById('categoryTitle').textContent=type;document.getElementById('addButton').textContent=type==='お金'?'＋ お金の管理を追加':'＋ '+type+'を追加';document.getElementById('moneyPanel').classList.toggle('hide',type!=='お金');renderCalendars();renderDayEntries();if(type==='お金')renderMoney()}

function entryForDay(){return entries.filter(e=>e.type===active&&occursOn(e,selectedDate)).map(e=>({...e,displayDate:selectedDate,occurrence: selectedDate!==e.date})).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}

function cardHTML(e){let listImg=e.thumb||(e.images&&e.images[0])||(e.memoSections?.find(sec=>sec.images?.length)?.images?.[0])||'';let img=listImg?`<img src=\"${listImg}\" loading=\"lazy\" decoding=\"async\">`:'📔';return `<div class=\"entry-card\" onclick=\"showDetail('${e.id}')\"><div class=\"thumb\" style=\"width:100%;height:auto;aspect-ratio:16/9\">${img}</div><div class=\"entry-info\"><div class=\"entry-title\">${esc(e.title||'タイトルなし')}</div><div class=\"entry-date\">${e.displayDate||e.date||''}${e.time?' · '+e.time:''}${e.occurrence?' · 繰り返し':''}</div></div></div>`}
function renderNotifications(){
  const wrap=document.getElementById('notifications');
  const d=new Date(selectedDate+'T00:00:00');
  const dateTitle=`${d.getMonth()+1}月${d.getDate()}日（${['日','月','火','水','木','金','土'][d.getDay()]}）の通知一覧`;
  const title=document.getElementById('homeSelectedTitle');if(title)title.textContent=dateTitle;
  let occurrences=entries.filter(e=>e.date&&occursOn(e,selectedDate)).map(e=>({...e,displayDate:selectedDate,occurrence:selectedDate!==e.date}));
  occurrences.sort((a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00'));
  document.getElementById('noticeCount').textContent=occurrences.length+'件';
  if(!occurrences.length){wrap.innerHTML='<div class="empty">この日に登録された通知はありません</div>';return;}
  wrap.innerHTML=occurrences.map(e=>{let dateText=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}. ${d.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase()}${e.time?' '+e.time:''}`;let preview=e.body||((e.type==='Todo'&&e.todos?.length)?e.todos.map(t=>t.text).join('・'):(e.type==='お金'?`${money(Number(e.amount||0)*Number(e.quantity||1))} · ${e.quantity||1}個`:''));let repeatTag=e.repeat&&e.repeat!=='none'?` · ${repeatLabel(e.repeat)}`:'';return `<div class="notice" onclick="showDetail('${e.id}')"><div class="notice-top">${esc(dateText)}</div><div class="notice-row"><div class="notice-thumb">${e.thumb?`<img src="${e.thumb}" alt="" loading="lazy" decoding="async">`:'▧'}</div><div class="notice-text"><div class="notice-title">${esc(e.title||e.type+'の登録')}</div>${preview?`<div class="notice-preview">${esc(preview)}</div>`:''}</div></div><div class="notice-bottom">${esc(e.type+repeatTag)}${e.occurrence?' · 繰り返し':''}</div></div>`}).join('');
}
function renderMoney(){let month=selectedDate.slice(0,7),budget=Number(budgets[month]||0),monthEntries=entries.filter(e=>e.type==='お金'&&e.date?.startsWith(month)),total=monthEntries.reduce((s,e)=>s+(Number(e.amount||0)*Number(e.quantity||1)),0);document.getElementById('budgetDisplay').textContent=money(budget);document.getElementById('remainingDisplay').textContent=money(budget-total);document.getElementById('budgetInput').value=budgets[month]||'';}
function renderMoneyDay(){let list=entryForDay(),total=list.reduce((s,e)=>s+(Number(e.amount||0)*Number(e.quantity||1)),0);let base=Number(budgets[selectedDate.slice(0,7)]||0);return `<div class="money-total">この日の合計：${money(total)}</div><div class="muted" style="text-align:right;margin-top:5px">月予算 ${money(base)} · 月残高 ${money(base-entries.filter(e=>e.type==='お金'&&e.date?.startsWith(selectedDate.slice(0,7))).reduce((s,e)=>s+Number(e.amount||0)*Number(e.quantity||1),0))}</div>`}

function chooseMonthCover(){document.getElementById('monthCoverFile').click()}

function chooseYearCover(){if(!document.getElementById('yearIndexScreen').classList.contains('hide'))coverYear=indexYear;document.getElementById('yearCoverFile').click()}

function renderMonthIndex(){let title=document.getElementById('monthIndexYear'),grid=document.getElementById('monthIndexGrid');if(!title||!grid)return;title.textContent=`${indexYear}年 月間INDEX`;grid.innerHTML=Array.from({length:12},(_,i)=>{let key=`${indexYear}-${String(i+1).padStart(2,'0')}`,src=monthCovers[key];return `<div class="index-card" onclick="openMonthFromIndex(${indexYear},${i})">${src?`<img src="${src}" loading="lazy" decoding="async">`:`<div style="aspect-ratio:16/9;display:grid;place-items:center;color:var(--muted);background:#292930">${i+1}月</div>`}<div class="index-label">${i+1}月</div><div class="index-sub">月間ページへ</div></div>`}).join('')}

function renderMoney(){let month=selectedDate.slice(0,7),budget=Number(budgets[month]||0),monthEntries=entries.filter(e=>e.type==='お金'&&e.date?.startsWith(month)),total=monthEntries.reduce((sum,e)=>sum+(Number(e.amount||0)*Number(e.quantity||1)),0);document.getElementById('budgetDisplay').textContent=money(budget);document.getElementById('remainingDisplay').textContent=money(budget-total);document.getElementById('budgetInput').value=budgets[month]||'';}

function addCategoryFromForm(){let name=prompt('追加するカテゴリー名');if(!name)return;name=name.trim();if(!name)return;if(!categories[active].includes(name)){categories[active].push(name);categories[active].sort((a,b)=>a.localeCompare(b,'ja'));}let select=document.getElementById('fCategory'),oldValue=select.value;select.innerHTML='<option value="">カテゴリーなし</option>'+categories[active].map(c=>`<option value="${escAttr(c)}">${esc(c)}</option>`).join('');select.value=name;saveCategoryState()}async function saveCategoryState(){try{await persistState()}catch(e){}try{localStorage.setItem('pocketPlannerCategories_v1',JSON.stringify(categories))}catch(e){}}
function openForm(){editingId=null;buildForm(null)}
function buildForm(old){document.getElementById('formTitle').textContent=(old?'編集':'新規登録')+' · '+active;let html=`<div class="field"><label>サムネイル画像</label><input type="file" id="thumbFile" accept="image/*"><div class="preview" id="thumbPreview">${old?.thumb?`<span class="preview-item"><img src="${old.thumb}"><button type="button" onclick="removeThumb()">×</button></span>`:''}</div></div><div class="field"><label>日付</label><input type="date" id="fDate" value="${old?.date||selectedDate}"></div>`;
 if(active!=='お金')html+=`<div class="repeat-panel"><strong>日付の繰り返し登録</strong><div class="field"><label>繰り返し</label><select id="fRepeat"><option value="none" ${(!old?.repeat||old.repeat==='none')?'selected':''}>繰り返しなし</option><option value="daily" ${old?.repeat==='daily'?'selected':''}>毎日</option><option value="weekly" ${old?.repeat==='weekly'?'selected':''}>毎週（登録日の曜日）</option><option value="monthly" ${old?.repeat==='monthly'?'selected':''}>毎月（登録日）</option><option value="yearly" ${old?.repeat==='yearly'?'selected':''}>毎年（登録日）</option></select></div><div class="field"><label>繰り返し終了日（任意）</label><input type="date" id="fRepeatEnd" value="${old?.repeatEnd||''}"></div><div class="repeat-help">通知ではなく、指定した日付に登録内容を自動表示します。元の登録データは1件のままです。</div></div>`;

if(active!=='お金'&&active!=='Todo')html+=`<div class="field"><label>リマインド時間（任意）</label><input type="time" id="fTime" value="${old?.time||''}"></div><div class="field"><label><input type="checkbox" id="fReminder" ${old?.reminder!==false?'checked':''} style="width:auto"> 時間になったらリマインドする</label><div class="repeat-help">アプリを開いている間に通知します。アプリを閉じている時のiPhone通知はHTML単体では保証できません。</div></div>`;
html+=`<div class="field"><label>カテゴリー</label><div style="display:flex;gap:7px"><select id="fCategory" style="flex:1;width:auto"><option value="">カテゴリーなし</option>${(categories[active]||[]).map(c=>`<option value="${escAttr(c)}" ${old?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button type="button" onclick="addCategoryFromForm()">＋追加</button></div></div>`;
if(active!=='メモ')html+=`<div class="field"><label>${active==='予定'?'予定title':active==='Todo'?'リストtitle':'管理title'}</label><input id="fTitle" value="${escAttr(old?.title||'')}" placeholder="タイトル"></div>`;
if(active==='予定')html+=`<div class="field"><label>予定内容</label><textarea id="fBody">${esc(old?.body||'')}</textarea></div><div class="field"><label>画像（複数選択可）</label><input type="file" id="fImages" accept="image/*" multiple><div class="preview" id="imagePreview">${(old?.images||[]).map((x,i)=>`<span class="preview-item"><img src="${x}" loading="lazy" decoding="async"><button type="button" onclick="removeImage(${i})">×</button></span>`).join('')}</div></div>`;
if(active==='メモ'){let sections=old?.memoSections?.length?old.memoSections:[{title:old?.title||'',body:old?.body||'',images:old?.images||[],urls:old?.urls||[]}];html+=`<div class="field"><label>メモ（タイトル・本文・画像をセットで複数登録できます）</label><div id="memoSections">${sections.map((sec,i)=>memoSectionField(sec,i)).join('')}</div><button type="button" onclick="addMemoSection()">＋メモを追加</button></div>`};
if(active==='Todo')html+=`<div class="field"><label>Todo項目（複数追加可・締切時間設定）</label><div id="todoFields">${(old?.todos||[{text:'',time:''}]).map(t=>todoField(t)).join('')}</div><button class="secondary" onclick="addTodoField()">＋項目を追加</button></div>`;
if(active==='お金')html+=`<div class="form-row"><div class="field"><label>金額（1個あたり）</label><input type="number" id="fAmount" value="${old?.amount||''}" placeholder="金額"></div><div class="field"><label>個数</label><input type="number" id="fQuantity" min="1" value="${old?.quantity||1}"></div></div><div class="field"><label>内容・メモ</label><textarea id="fBody">${esc(old?.body||'')}</textarea></div>`;
html+=`<div class="form-actions"><button type="button" onclick="enableReminderNotifications()">通知を許可</button><button onclick="saveEntry()">保存</button><button class="secondary" onclick="closeModal()">キャンセル</button></div>`;document.getElementById('formContent').innerHTML=html;document.getElementById('formBg').style.display='flex';document.getElementById('thumbFile').onchange=e=>previewFile(e.target.files[0],'thumbPreview');if(document.getElementById('fImages'))document.getElementById('fImages').onchange=async e=>{let chosen=Array.from(e.target.files||[]);if(chosen.length){let current=JSON.parse(document.getElementById('formContent').dataset.images||'[]');current.push(...await Promise.all(chosen.map(fileData)));document.getElementById('formContent').dataset.images=JSON.stringify(current);renderImagePreviews(current)}e.target.value=''};document.getElementById('thumbFile').onchange=async e=>{if(e.target.files[0]){document.getElementById('formContent').dataset.thumb=await fileData(e.target.files[0]);renderThumbPreview(document.getElementById('formContent').dataset.thumb)}};if(old){document.getElementById('formContent').dataset.old=JSON.stringify(old);document.getElementById('formContent').dataset.images=JSON.stringify(old.images||[]);document.getElementById('formContent').dataset.thumb=old.thumb||''}else{document.getElementById('formContent').dataset.old='';document.getElementById('formContent').dataset.images='[]';document.getElementById('formContent').dataset.thumb=''}}
function parseMemoUrls(value){return (value||'').split(/\n+/).map(v=>v.trim()).filter(Boolean).map(v=>{if(!/^https?:\/\//i.test(v))v='https://'+v;try{let u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}).filter(Boolean)}
function memoSectionField(sec={},i){let imgs=sec.images||[];return `<div class="memo-section panel" style="padding:12px;margin:9px 0" data-images='${JSON.stringify(imgs).replace(/'/g,'&#39;')}'><div class="panel-head"><strong>メモ ${i+1}</strong><button type="button" onclick="removeMemoSection(this)">削除</button></div><div class="field"><label>title</label><input class="memo-title" value="${escAttr(sec.title||'')}" placeholder="メモタイトル"></div><div class="field"><label>メモ</label><textarea class="memo-body" placeholder="内容を入力">${esc(sec.body||'')}</textarea></div><div class="field"><label>URL（複数可・1行に1つ）</label><textarea class="memo-urls" placeholder="https://example.com&#10;https://...">${esc((sec.urls||[]).join('\n'))}</textarea></div><div class="field"><label>このメモの画像（複数可）</label><input type="file" accept="image/*" multiple onchange="addMemoImages(this)"><div class="preview memo-preview">${imgs.map((src,j)=>`<span class="preview-item"><img src="${src}" loading="lazy" decoding="async"><button type="button" onclick="removeMemoImage(this,${j})">×</button></span>`).join('')}</div></div></div>`}
function addMemoSection(){let wrap=document.getElementById('memoSections');wrap.insertAdjacentHTML('beforeend',memoSectionField({},wrap.querySelectorAll('.memo-section').length));}
function removeMemoSection(btn){let sections=document.querySelectorAll('.memo-section');if(sections.length<=1){alert('メモは最低1つ残してください');return;}btn.closest('.memo-section').remove();}
async function addMemoImages(input){let el=input.closest('.memo-section'),imgs=JSON.parse(el.dataset.images||'[]');let files=Array.from(input.files||[]);if(files.length){imgs.push(...await Promise.all(files.map(fileData)));el.dataset.images=JSON.stringify(imgs);renderMemoImages(el,imgs);}input.value='';}
function renderMemoImages(el,imgs){let box=el.querySelector('.memo-preview');box.innerHTML=imgs.map((src,i)=>`<span class="preview-item"><img src="${src}" loading="lazy" decoding="async"><button type="button" onclick="removeMemoImage(this,${i})">×</button></span>`).join('');}

function todoField(t={text:'',time:''}){return `<div class="form-row todo-field" style="align-items:center;margin:7px 0"><div class="field" style="margin:0"><input class="todo-text" placeholder="Todo内容" value="${escAttr(t.text||'')}"></div><div class="field" style="margin:0"><input class="todo-time" type="time" value="${t.time||''}"></div></div>`}function addTodoField(){document.getElementById('todoFields').insertAdjacentHTML('beforeend',todoField())}
function previewFile(file,target){if(!file)return;let r=new FileReader();r.onload=()=>document.getElementById(target).innerHTML=`<img src="${r.result}">`;r.readAsDataURL(file)}function previewFiles(files,target){if(!files?.length)return;let arr=[];Array.from(files).forEach(f=>{let r=new FileReader();r.onload=()=>{arr.push(`<img src="${r.result}">`);document.getElementById(target).innerHTML=arr.join('')};r.readAsDataURL(f)})}
function renderImagePreviews(arr){let box=document.getElementById("imagePreview");if(!box)return;box.innerHTML=arr.map((src,i)=>`<span class="preview-item"><img src="${src}" loading="lazy" decoding="async"><button type="button" onclick="removeImage(${i})">×</button></span>`).join("")}function removeImage(i){let box=document.getElementById("formContent"),arr=JSON.parse(box.dataset.images||"[]");arr.splice(i,1);box.dataset.images=JSON.stringify(arr);renderImagePreviews(arr)}function renderThumbPreview(src){let box=document.getElementById("thumbPreview");if(box)box.innerHTML=src?`<span class="preview-item"><img src="${src}" loading="lazy" decoding="async"><button type="button" onclick="removeThumb()">×</button></span>`:""}function removeThumb(){let box=document.getElementById("formContent");box.dataset.thumb="";let input=document.getElementById("thumbFile");if(input)input.value="";renderThumbPreview("")}async function saveEntry(){
  const old=JSON.parse(document.getElementById('formContent').dataset.old||'null');
  let thumb=document.getElementById('formContent').dataset.thumb||'',images=JSON.parse(document.getElementById('formContent').dataset.images||'[]');
  const date=document.getElementById('fDate').value,title=(document.getElementById('fTitle')?.value||'').trim();
  if(active!=='メモ'&&!title){alert('タイトルを入力してください');return;}
  if(active==='メモ'){const sections=[...document.querySelectorAll('.memo-section')].map((el,i)=>({title:el.querySelector('.memo-title').value.trim(),body:el.querySelector('.memo-body').value.trim(),images:JSON.parse(el.dataset.images||'[]'),urls:parseMemoUrls(el.querySelector('.memo-urls')?.value||'')})).filter(sec=>sec.title||sec.body||sec.images.length||sec.urls.length);if(!sections.length){alert('メモのタイトル・本文・画像のいずれかを入力してください');return;} }
  // Read recurrence controls explicitly; on edits, preserve the stored values if a control is absent.
  const repeatControl=document.getElementById('fRepeat');
  const repeatEndControl=document.getElementById('fRepeatEnd');
  const anniversaryControl=document.getElementById('fAnniversary');
  const repeatValue=active!=='お金'?(repeatControl ? repeatControl.value : (old?.repeat||'none')):'none';
  const repeatEndValue=active!=='お金'?(repeatEndControl ? repeatEndControl.value : (old?.repeatEnd||'')):'';
  const anniversaryValue=active==='予定'?(anniversaryControl ? anniversaryControl.checked : !!old?.anniversary):false;
  const obj={id:old?.id||crypto.randomUUID(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),type:active,category:document.getElementById('fCategory')?.value||'',date,time:document.getElementById('fTime')?.value||old?.time||'',title,thumb,images,body:document.getElementById('fBody')?.value||'',repeat:repeatValue,repeatEnd:repeatEndValue,anniversary:anniversaryValue,reminder:active!=='お金'?(document.getElementById('fReminder')?.checked!==false&&!!document.getElementById('fTime')?.value):false,notified:old?.notified||[]};
  if(obj.anniversary){obj.repeat='yearly';obj.repeatEnd='';}
  if(active==='メモ'){obj.memoSections=[...document.querySelectorAll('.memo-section')].map(el=>({title:el.querySelector('.memo-title').value.trim(),body:el.querySelector('.memo-body').value.trim(),images:JSON.parse(el.dataset.images||'[]'),urls:parseMemoUrls(el.querySelector('.memo-urls')?.value||'')})).filter(sec=>sec.title||sec.body||sec.images.length||sec.urls.length);obj.title=obj.memoSections[0]?.title||'メモ';obj.body='';obj.images=[];}

function searchEntries(q){let box=document.getElementById('searchResults');q=(q||'').trim().toLowerCase();if(!q){box.innerHTML='<div class="empty">検索キーワードを入力してください</div>';return}let found=entries.filter(e=>{let text=[e.type,e.category,e.title,e.body,e.date,e.time,e.memoSections?.map(s=>s.title+' '+s.body+' '+(s.urls||[]).join(' ')).join(' '),e.todos?.map(t=>t.text).join(' '),e.amount,e.quantity].join(' ').toLowerCase();return text.includes(q)}).sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!found.length){box.innerHTML='<div class="empty">見つかりませんでした</div>';return}box.innerHTML=found.map(e=>`<div class="notice" onclick="showDetail('${e.id}')"><div class="notice-top">${esc(e.date||'日付なし')} ${e.time||''}</div><div class="notice-title">${esc(e.title||e.type)}</div><div class="notice-bottom">${esc(e.type)}${e.category?' · '+esc(e.category):''}</div></div>`).join('')}
function zipCrc32(bytes){let crc=0xffffffff;for(let i=0;i<bytes.length;i++){crc^=bytes[i];for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return (crc^0xffffffff)>>>0}
